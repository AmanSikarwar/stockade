[project]
name = "stockade-backend"
version = "0.1.0"
description = "Self-hostable inventory and order management backend."
requires-python = ">=3.14"
dependencies = [
  "alembic==1.18.4",
  "argon2-cffi==25.1.0",
  "fastapi==0.136.3",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "sqlalchemy==2.0.50",
  "uvicorn[standard]==0.48.0",
]

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "ruff==0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
