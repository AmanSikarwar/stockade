[project]
name = "stockade-backend"
version = "0.1.0"
description = "Self-hostable inventory and order management backend."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "ruff==0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
