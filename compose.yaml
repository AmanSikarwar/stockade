services:
  db:
    image: postgres:18-alpine
    env_file:
      - ${STOCKADE_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - stockade_postgres_data:/var/lib/postgresql
    networks:
      - stockade

  backend:
    build:
      context: ./backend
    env_file:
      - ${STOCKADE_ENV_FILE:-.env}
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import os, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:%s/ready\" % os.getenv(\"BACKEND_PORT\", \"8000\"), timeout=2)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - stockade

networks:
  stockade:

volumes:
  stockade_postgres_data:
